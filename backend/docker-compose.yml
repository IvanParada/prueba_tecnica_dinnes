version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dinnes_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dinnes_db
      POSTGRES_USER: dinnes_user
      POSTGRES_PASSWORD: dinnes_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: