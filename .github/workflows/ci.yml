name: Continuous Integration

on:
  push:
    branches:
      - main
      - feature/testing-ci-cd

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Rollup native binary for Linux
        shell: bash
        run: |
          ROLLUP_VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
          echo "Installing Rollup Linux binary version $ROLLUP_VERSION"
          npm install \
            --no-save \
            --package-lock=false \
            "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
          npm ls @rollup/rollup-linux-x64-gnu

      - name: Run backend lint
        run: npm run lint --workspace=backend

      - name: Run backend lint
        run: npm run lint --workspace=backend

      - name: Run backend unit tests
        run: npm run test:ci --workspace=backend

      - name: Build backend and frontend
        run: npm run build:all